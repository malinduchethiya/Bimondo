const VERT=`#version 300 es
precision highp float;
layout(location=0) in vec2 aXZ;
layout(location=1) in float aElevation;
layout(location=2) in float aShade;

layout(location=4) in float aBottom;
uniform mat4 uVP;
uniform float uRelief;
out vec3 vNormal;
out float vElevation;
out float vShade;
void main(){
 float elevation=max(0.0,aElevation);
 float y=mix(0.025+elevation*0.00054*uRelief,-0.085,aBottom);
 gl_Position=uVP*vec4(aXZ.x,y,aXZ.y,1.0);
 vNormal=normalize(vec3(aNormal.x*uRelief,aNormal.y,aNormal.z*uRelief));
 vElevation=elevation;
 vShade=aShade;
}`;
const FRAG=`#version 300 es

uniform int uMode;

vec3 palette(float h){
 if(h<160.0)return mix(vec3(.18,.38,.20),vec3(.27,.45,.23),smoothstep(0.0,160.0,h));
 if(h<650.0)return mix(vec3(.27,.45,.23),vec3(.48,.56,.29),smoothstep(160.0,650.0,h));
 if(h<1200.0)return mix(vec3(.48,.56,.29),vec3(.67,.59,.31),smoothstep(650.0,1200.0,h));
 if(h<1900.0)return mix(vec3(.67,.59,.31),vec3(.55,.39,.27),smoothstep(1200.0,1900.0,h));

   color=vec3(.13,.29,.24)*(0.72+0.3*diffuse);
 } else if(uMode==2){

   color=palette(vElevation);

   color*=.79+.31*diffuse;
   // A restrained topographic-style fill, not glossy plastic.
   color=mix(color,vec3(.93,.95,.87),.035);
 }
 fragColor=vec4(pow(clamp(color,0.0,1.0),vec3(.92)),1.0);
}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function program(v,f){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,v));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
const prog=program(VERT,FRAG);
const uni={vp:gl.getUniformLocation(prog,'uVP'),relief:gl.getUniformLocation(prog,'uRelief'),mode:gl.getUniformLocation(prog,'uMode'),side:gl.getUniformLocation(prog,'uSide')};
const W=230,H=416,SX=4.30,SZ=7.8,LON0=79.49,LON1=82.07,LAT0=9.91,LAT1=5.83;
const total=W*H;
const isLand=new Uint8Array(total),alt=new Float32Array(total),refShade=new Float32Array(total),normals=new Float32Array(total*3);
const xz=new Float32Array(total*2);
let realElevation=false,topMesh=null,sideMesh=null,mode='natural',relief=.86;
let yaw=.28,pitch=.98,distance=13.4,target=[0,0.33,0],targetYaw=yaw,targetPitch=pitch,targetDist=distance,flyAnimation=null;
const places={
 sigiriya:{name:'Sigiriya Rock',lon:80.76,lat:7.958},
 knuckles:{name:'Knuckles Range',lon:80.78,lat:7.45},
 nuwara:{name:'Nuwara Eliya',lon:80.771,lat:6.97},
 ella:{name:'Ella',lon:81.047,lat:6.875}
};
const placement={};
function heightAtPixel(i){return alt[i]}
function sample(x,z){const u=x/SX+.5,v=z/SZ+.5;if(u<0||u>1||v<0||v>1)return null;let xi=Math.round(u*(W-1)),yi=Math.round(v*(H-1));let id=yi*W+xi;if(!isLand[id])return null;return {id,elevation:alt[id],u,v,x,z,y:.025+Math.max(0,alt[id])*.00054*relief}}
function index(x,y){return y*W+x}
function recalcNormals(){
 const dx=SX/(W-1),dz=SZ/(H-1);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=index(x,y);const L=alt[index(Math.max(x-1,0),y)],R=alt[index(Math.min(x+1,W-1),y)];
  const T=alt[index(x,Math.max(y-1,0))],B=alt[index(x,Math.min(y+1,H-1))];
  let nx=-(R-L)*.00054/(2*dx),ny=1,nz=-(B-T)*.00054/(2*dz);
  const len=Math.hypot(nx,ny,nz)||1;normals[i*3]=nx/len;normals[i*3+1]=ny/len;normals[i*3+2]=nz/len;
 }
}
function makeBuffers(vertices,heights,shades,norms,bottoms,indices){
 const vao=gl.createVertexArray();gl.bindVertexArray(vao);
 const attribs=[[new Float32Array(vertices),0,2],[new Float32Array(heights),1,1],[new Float32Array(shades),2,1],[new Float32Array(norms),3,3],[new Float32Array(bottoms),4,1]];
 for(const [a,loc,n] of attribs){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);gl.vertexAttribPointer(loc,n,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(loc);}
 const mesh={vao,count:indices?indices.length:heights.length,drawIndices:!!indices,buffers:attribs.length};
 if(indices){const b=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(indices),gl.STATIC_DRAW)}
 gl.bindVertexArray(null);return mesh;
}
function deleteMesh(m){if(m)gl.deleteVertexArray(m.vao)}
function rebuild(){
 recalcNormals();
 const positions=[],heights=[],shades=[],norms=[],bottoms=[];
 const active=new Uint8Array((W-1)*(H-1));
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=index(x,y);positions.push(xz[i*2],xz[i*2+1]);heights.push(alt[i]);shades.push(refShade[i]);norms.push(normals[i*3],normals[i*3+1],normals[i*3+2]);bottoms.push(0)}
 const indices=[];
 for(let y=0;y<H-1;y++)for(let x=0;x<W-1;x++){
  const a=index(x,y),b=a+1,c=a+W,d=c+1;
  if(isLand[a]&&isLand[b]&&isLand[c]&&isLand[d]){active[y*(W-1)+x]=1;indices.push(a,c,b,b,c,d)}
 }
 deleteMesh(topMesh);topMesh=makeBuffers(positions,heights,shades,norms,bottoms,indices);
 const wp=[],wh=[],ws=[],wn=[],wb=[];
 function addVertex(idx,bottom,nx,nz){wp.push(xz[idx*2],xz[idx*2+1]);wh.push(alt[idx]);ws.push(refShade[idx]);wn.push(nx,0,nz);wb.push(bottom)}
 function wall(a,b,nx,nz){addVertex(a,0,nx,nz);addVertex(b,0,nx,nz);addVertex(a,1,nx,nz);addVertex(b,0,nx,nz);addVertex(b,1,nx,nz);addVertex(a,1,nx,nz)}
 for(let y=0;y<H-1;y++)for(let x=0;x<W-1;x++){
  if(!active[y*(W-1)+x])continue;
  const a=index(x,y),b=a+1,c=a+W,d=c+1;
  if(y===0||!active[(y-1)*(W-1)+x])wall(a,b,0,-1);
  if(y===H-2||!active[(y+1)*(W-1)+x])wall(c,d,0,1);
  if(x===0||!active[y*(W-1)+(x-1)])wall(a,c,-1,0);
  if(x===W-2||!active[y*(W-1)+(x+1)])wall(b,d,1,0);
 }
 deleteMesh(sideMesh);sideMesh=makeBuffers(wp,wh,ws,wn,wb,null);
}
function norm(v){let l=Math.hypot(...v)||1;return v.map(x=>x/l)}
function sub(a,b){return a.map((v,i)=>v-b[i])}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0)}
function mult(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
function perspective(aspect){const f=1/Math.tan(46*Math.PI/360),n=.1,fa=80;return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0])}
function lookAt(e,t){let z=norm(sub(e,t)),x=norm(cross([0,1,0],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1])}
function project(pt,m,w,h){let [x,y,z]=pt;const rx=m[0]*x+m[4]*y+m[8]*z+m[12],ry=m[1]*x+m[5]*y+m[9]*z+m[13],rw=m[3]*x+m[7]*y+m[11]*z+m[15];if(rw<=0)return null;return {x:(rx/rw*.5+.5)*w,y:(.5-ry/rw*.5)*h,visible:Math.abs(rx/rw)<1.5&&Math.abs(ry/rw)<1.5}}
function getEye(){return [target[0]+distance*Math.sin(yaw)*Math.cos(pitch),target[1]+distance*Math.sin(pitch),target[2]+distance*Math.cos(yaw)*Math.cos(pitch)]}

function defaultZoom(){const aspect=Math.max(.25,stage.clientWidth/Math.max(1,stage.clientHeight));return Math.max(13.4,8.6/aspect)}
let prev=performance.now();
function draw(now){
 const dt=Math.min((now-prev)/1000,.05);prev=now;
 distance+=(targetDist-distance)*Math.min(1,dt*10);
 pitch+=(targetPitch-pitch)*Math.min(1,dt*12);
 yaw+=(targetYaw-yaw)*Math.min(1,dt*12);
 const rect=stage.getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,2);
 const w=Math.max(1,Math.round(rect.width*dpr)),h=Math.max(1,Math.round(rect.height*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}
 gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
 const eye=getEye(),view=lookAt(eye,target),vp=mult(perspective(w/h),view);
 if(topMesh){gl.useProgram(prog);gl.uniformMatrix4fv(uni.vp,false,vp);
  gl.uniform1f(uni.relief,relief);gl.uniform1i(uni.mode,0);
  gl.uniform1i(uni.side,1);gl.bindVertexArray(sideMesh.vao);gl.drawArrays(gl.TRIANGLES,0,sideMesh.count);
  gl.uniform1i(uni.side,0);gl.bindVertexArray(topMesh.vao);gl.drawElements(gl.TRIANGLES,topMesh.count,gl.UNSIGNED_INT,0);gl.bindVertexArray(null);
 }
 requestAnimationFrame(draw);
}
requestAnimationFrame(()=>{distance=targetDist=defaultZoom();requestAnimationFrame(draw)});

const IMG=new Image();IMG.onload=()=>{
 const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(IMG,0,0,W,H);
 const src=ctx.getImageData(0,0,W,H).data;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=index(x,y),k=i*4;
  isLand[i]=src[k+3]>115?1:0;alt[i]=src[k]*256+src[k+1];refShade[i]=src[k+2]/255;
  xz[i*2]=(x/(W-1)-.5)*SX;xz[i*2+1]=(y/(H-1)-.5)*SZ;
 }
 rebuild();
};IMG.onerror=()=>console.error('Could not load terrain image');IMG.src=EMBEDDED_TERRAIN;
const pointers=new Map();let pinchDistance=0;let moved=false;
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);
 canvas.style.cursor='grabbing';
 if(pointers.size===2){const a=[...pointers.values()];pinchDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=true;
 if(pointers.size>=2){const a=[...pointers.values()],next=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  if(pinchDistance>5&&next>5)targetDist=Math.max(4.4,Math.min(26,targetDist*pinchDistance/next));pinchDistance=next;
 } else {targetYaw-=dx*.007;targetPitch=Math.min(1.49,Math.max(.17,targetPitch+dy*.007))}
});
function release(e){pointers.delete(e.pointerId);pinchDistance=0;if(!pointers.size)canvas.style.cursor='grab'}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('wheel',e=>{e.preventDefault();targetDist=Math.max(4.4,Math.min(26,targetDist*Math.exp(e.deltaY*.001)))},{passive:false});
canvas.addEventListener('dblclick',()=>{targetYaw=.28;targetPitch=.98;targetDist=defaultZoom();target=[0,.33,0]});
canvas.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')targetYaw-=.12;
 if(e.key==='ArrowRight')targetYaw+=.12;
 if(e.key==='ArrowUp')targetPitch=Math.max(.17,targetPitch-.10);
 if(e.key==='ArrowDown')targetPitch=Math.min(1.49,targetPitch+.10);
 if(e.key==='+'||e.key==='=')targetDist=Math.max(4.4,targetDist*.85);
 if(e.key==='-')targetDist=Math.min(26,targetDist*1.15);
});

}
